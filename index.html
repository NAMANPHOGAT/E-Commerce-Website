<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyStore</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const products = [
        {
          id: 1,
          name: 'Running Shoes',
          price: '₹7,499',
          image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff',
          cta: 'Add to Cart',
        },
        {
          id: 2,
          name: 'Laptop',
          price: '₹64,999',
          image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8',
          cta: 'Add to Cart',
        },
        {
          id: 3,
          name: 'Headphones',
          price: '₹9,999',
          image: 'https://images.unsplash.com/photo-1585386959984-a41552231658',
          cta: 'Add to Cart',
        },
      ];

      const deals = [
        {
          id: 4,
          name: 'Laptop Pro Deal',
          oldPrice: '₹79,999',
          price: '₹64,999',
          image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8',
          badge: '19% OFF',
          cta: 'Grab Deal',
        },
        {
          id: 5,
          name: 'Air Jordans',
          oldPrice: '₹18,000',
          price: '₹14,499',
          image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff',
          badge: '20% OFF',
          cta: 'Grab Deal',
        },
      ];

      function ProductCard({ item, onAdd }) {
        return (
          <article className="relative rounded-2xl bg-white p-5 shadow-lg transition hover:-translate-y-2">
            {item.badge && (
              <span className="absolute left-4 top-4 rounded-full bg-red-500 px-3 py-1 text-xs font-semibold text-white">
                {item.badge}
              </span>
            )}
            <img
              src={item.image}
              alt={item.name}
              className="h-52 w-full rounded-xl object-cover"
            />
            <h3 className="mt-4 text-xl font-semibold">{item.name}</h3>
            {item.oldPrice ? (
              <p className="mt-2 text-base">
                <span className="mr-2 text-sm text-slate-400 line-through">{item.oldPrice}</span>
                <span className="font-bold text-sky-500">{item.price}</span>
              </p>
            ) : (
              <p className="mt-2 font-bold text-sky-500">{item.price}</p>
            )}
            <button
              onClick={onAdd}
              className="mt-4 w-full rounded-lg bg-slate-900 px-4 py-2 text-white transition hover:bg-cyan-500"
            >
              {item.cta}
            </button>
          </article>
        );
      }

      function App() {
        const [cartCount, setCartCount] = useState(0);

        const addToCart = () => setCartCount((count) => count + 1);

        const scrollToSection = (id) => {
          document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        };

        return (
          <>
            <header className="sticky top-0 z-50 flex items-center justify-between bg-slate-950 px-5 py-4 text-white md:px-14">
              <div className="text-2xl font-bold text-cyan-400">MyStore</div>
              <nav>
                <ul className="hidden gap-8 md:flex">
                  <li><a className="transition hover:text-cyan-400" href="#">Home</a></li>
                  <li><a className="transition hover:text-cyan-400" href="#shop">Shop</a></li>
                  <li><a className="transition hover:text-cyan-400" href="#deals">Deals</a></li>
                  <li><a className="transition hover:text-cyan-400" href="#contact">Contact</a></li>
                </ul>
              </nav>
              <div className="relative text-xl">
                🛒
                <span className="absolute -right-3 -top-2 rounded-full bg-red-500 px-2 py-0.5 text-xs">
                  {cartCount}
                </span>
              </div>
            </header>

            <section
              className="flex min-h-[90vh] flex-col items-center justify-center bg-cover bg-center px-5 text-center text-white"
              style={{
                backgroundImage:
                  "linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1607082349566-187342175e2f')",
              }}
            >
              <h1 className="text-4xl font-bold md:text-6xl">Big Sale 30% OFF</h1>
              <p className="mt-4">Upgrade your lifestyle with premium products</p>
              <button
                onClick={() => scrollToSection('shop')}
                className="mt-8 rounded-full bg-cyan-400 px-10 py-3 text-lg font-medium text-slate-950 transition hover:scale-105 hover:bg-cyan-500"
              >
                Shop Now
              </button>
            </section>

            <main className="space-y-20 px-5 py-16 md:px-14">
              <section id="shop">
                <h2 className="mb-10 text-center text-4xl font-bold">Shop Products</h2>
                <div className="grid gap-8 md:grid-cols-2 xl:grid-cols-3">
                  {products.map((item) => (
                    <ProductCard key={item.id} item={item} onAdd={addToCart} />
                  ))}
                </div>
              </section>

              <section id="deals">
                <h2 className="mb-10 text-center text-4xl font-bold">Hot Deals</h2>
                <div className="grid gap-8 md:grid-cols-2">
                  {deals.map((item) => (
                    <ProductCard key={item.id} item={item} onAdd={addToCart} />
                  ))}
                </div>
              </section>

              <section id="contact">
                <h2 className="mb-10 text-center text-4xl font-bold">Contact Us</h2>
                <div className="mx-auto max-w-2xl rounded-3xl bg-white p-10 text-center shadow-xl">
                  <p><strong>Email:</strong> support@mystore.in</p>
                  <p className="mt-2"><strong>Phone:</strong> +91 9998887776</p>
                  <p className="mt-2"><strong>Address:</strong> Sector 62, Noida Extension, Uttar Pradesh, India - 201301</p>
                  <input className="mt-6 w-full rounded-lg border border-slate-300 px-3 py-2" type="text" placeholder="Your Name" />
                  <input className="mt-3 w-full rounded-lg border border-slate-300 px-3 py-2" type="email" placeholder="Your Email" />
                  <textarea className="mt-3 w-full rounded-lg border border-slate-300 px-3 py-2" rows="4" placeholder="Your Message"></textarea>
                  <button className="mt-4 rounded-lg bg-slate-900 px-8 py-2 text-white transition hover:bg-cyan-500">Send Message</button>
                </div>
              </section>
            </main>

            <footer className="bg-slate-950 px-6 py-8 text-center text-white">
              MyStore | Designed with heyitsme
            </footer>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
