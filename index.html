<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyStore Fresh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useMemo, useState } = React;

      const catalog = [
        {
          id: 1,
          name: "Running Shoes",
          price: 7499,
          image: "https://images.unsplash.com/photo-1460353581641-37baddab0fa2?auto=format&fit=crop&w=1000&q=80",
          tag: "Top Pick",
          action: "Add to Cart",
        },
        {
          id: 2,
          name: "Laptop",
          price: 64999,
          image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=1000&q=80",
          tag: "Best Seller",
          action: "Add to Cart",
        },
        {
          id: 3,
          name: "Headphones",
          price: 9999,
          image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=80",
          tag: "New",
          action: "Add to Cart",
        },
        {
          id: 4,
          name: "Gaming Keyboard",
          price: 4999,
          image: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?auto=format&fit=crop&w=1000&q=80",
          tag: "Trending",
          action: "Add to Cart",
        },
      ];

      const deals = [
        {
          id: 11,
          name: "Laptop Pro Deal",
          oldPrice: 79999,
          price: 64999,
          image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=1000&q=80",
          discount: "19% OFF",
          action: "Grab Deal",
        },
        {
          id: 12,
          name: "Air Jordans",
          oldPrice: 18000,
          price: 14499,
          image: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=1000&q=80",
          discount: "20% OFF",
          action: "Grab Deal",
        },
      ];

      const money = (amount) => `₹${amount.toLocaleString("en-IN")}`;

      function Header({ count }) {
        return (
          <header className="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/95 px-4 py-4 text-white backdrop-blur md:px-12">
            <div className="mx-auto flex max-w-6xl items-center justify-between">
              <p className="text-2xl font-bold tracking-wide text-cyan-400">MyStore</p>
              <nav className="hidden md:block">
                <ul className="flex gap-8 text-sm">
                  <li><a className="hover:text-cyan-300" href="#home">Home</a></li>
                  <li><a className="hover:text-cyan-300" href="#shop">Shop</a></li>
                  <li><a className="hover:text-cyan-300" href="#deals">Deals</a></li>
                  <li><a className="hover:text-cyan-300" href="#contact">Contact</a></li>
                </ul>
              </nav>
              <div className="relative text-2xl" aria-label="cart">🛒
                <span className="absolute -right-3 -top-2 rounded-full bg-red-500 px-2 py-0.5 text-xs font-semibold text-white">{count}</span>
              </div>
            </div>
          </header>
        );
      }

      function Card({ item, onAdd, isDeal = false }) {
        return (
          <article className="group overflow-hidden rounded-2xl bg-white shadow-lg ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-2xl">
            <div className="relative">
              {isDeal ? (
                <span className="absolute left-3 top-3 z-10 rounded-full bg-red-500 px-3 py-1 text-xs font-semibold text-white">{item.discount}</span>
              ) : (
                <span className="absolute left-3 top-3 z-10 rounded-full bg-cyan-500 px-3 py-1 text-xs font-semibold text-white">{item.tag}</span>
              )}
              <img src={item.image} alt={item.name} className="h-52 w-full object-cover" />
            </div>
            <div className="space-y-2 p-5">
              <h3 className="text-xl font-semibold">{item.name}</h3>
              {isDeal ? (
                <p>
                  <span className="mr-2 text-sm text-slate-400 line-through">{money(item.oldPrice)}</span>
                  <span className="font-bold text-cyan-600">{money(item.price)}</span>
                </p>
              ) : (
                <p className="font-bold text-cyan-600">{money(item.price)}</p>
              )}
              <button onClick={onAdd} className="w-full rounded-lg bg-slate-900 px-4 py-2 text-white transition hover:bg-cyan-500">{item.action}</button>
            </div>
          </article>
        );
      }

      function App() {
        const [cartCount, setCartCount] = useState(0);

        const featuredCount = useMemo(() => catalog.length + deals.length, []);
        const handleAdd = () => setCartCount((prev) => prev + 1);
        const goToShop = () => document.getElementById("shop")?.scrollIntoView({ behavior: "smooth" });

        return (
          <>
            <Header count={cartCount} />

            <section
              id="home"
              className="relative flex min-h-[88vh] items-center justify-center bg-cover bg-center px-6 text-white"
              style={{
                backgroundImage:
                  "linear-gradient(rgba(2, 6, 23, 0.65), rgba(2, 6, 23, 0.65)), url('https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=1600&q=80')",
              }}
            >
              <div className="text-center">
                <h1 className="text-4xl font-bold md:text-6xl">Fresh Start Sale 30% OFF</h1>
                <p className="mt-4 text-sm md:text-lg">{featuredCount} featured picks to upgrade your everyday lifestyle.</p>
                <button onClick={goToShop} className="mt-8 rounded-full bg-cyan-400 px-10 py-3 font-semibold text-slate-950 transition hover:scale-105 hover:bg-cyan-300">Shop Now</button>
              </div>
            </section>

            <main className="mx-auto max-w-6xl space-y-16 px-4 py-14 md:px-8">
              <section id="shop">
                <h2 className="mb-8 text-center text-3xl font-bold md:text-4xl">Shop Products</h2>
                <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
                  {catalog.map((item) => (
                    <Card key={item.id} item={item} onAdd={handleAdd} />
                  ))}
                </div>
              </section>

              <section id="deals">
                <h2 className="mb-8 text-center text-3xl font-bold md:text-4xl">Hot Deals</h2>
                <div className="grid gap-6 md:grid-cols-2">
                  {deals.map((item) => (
                    <Card key={item.id} item={item} onAdd={handleAdd} isDeal />
                  ))}
                </div>
              </section>

              <section id="contact">
                <h2 className="mb-8 text-center text-3xl font-bold md:text-4xl">Contact Us</h2>
                <div className="mx-auto max-w-2xl rounded-2xl bg-white p-8 text-center shadow-xl ring-1 ring-slate-200">
                  <p><strong>Email:</strong> support@mystore.in</p>
                  <p className="mt-2"><strong>Phone:</strong> +91 9998887776</p>
                  <p className="mt-2"><strong>Address:</strong> Sector 62, Noida Extension, Uttar Pradesh, India - 201301</p>
                  <div className="mt-6 space-y-3">
                    <input className="w-full rounded-lg border border-slate-300 px-3 py-2" type="text" placeholder="Your Name" />
                    <input className="w-full rounded-lg border border-slate-300 px-3 py-2" type="email" placeholder="Your Email" />
                    <textarea className="w-full rounded-lg border border-slate-300 px-3 py-2" rows="4" placeholder="Your Message"></textarea>
                    <button className="rounded-lg bg-slate-900 px-8 py-2 text-white transition hover:bg-cyan-500">Send Message</button>
                  </div>
                </div>
              </section>
            </main>

            <footer className="bg-slate-950 px-6 py-8 text-center text-sm text-white">MyStore | Fresh React + Tailwind storefront</footer>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
